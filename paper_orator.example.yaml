# paper-orator configuration
# Copy this file to paper_orator.yaml and fill in your values.
# Environment variables can be referenced with ${ENV_VAR} syntax.

# RSS feed settings
feed:
  title: "My Research Audio Feed"
  description: "Audio versions of research papers and articles"
  link: "https://example.com/feed/feed.xml"
  base_url: "https://example.com/feed/"
  language: "en-us"

# Text-to-speech settings
tts:
  # MAI voices use "<voice>:MAI-Voice-2.1" (or ":MAI-Voice-2.1-Flash"), e.g.
  # en-US-Harper, en-US-Olivia, en-US-Iris, en-US-Ethan, en-US-Grant, en-US-Sage.
  # Standard neural voices (e.g. "en-US-JennyNeural") also work.
  voice: "en-US-Harper:MAI-Voice-2.1"
  # Batch synthesis only supports standard neural voices; MAI/HD voices always
  # use chunked real-time synthesis, which has no length limit.
  use_batch: false

# Provider selection — which backend to use for each stage
# Currently supported: "azure"
providers:
  ocr: azure
  llm: azure
  tts: azure
  storage: azure

# Azure provider configuration
# Set these environment variables before running:
#   AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
#   AZURE_DOCUMENT_INTELLIGENCE_KEY
#   AZURE_OPENAI_ENDPOINT
#   AZURE_OPENAI_KEY
#   AZURE_OPENAI_DEPLOYMENT
#   AZURE_SPEECH_KEY
#   AZURE_SPEECH_REGION
#   AZURE_STORAGE_CONNECTION_STRING
#   AZURE_STORAGE_CONTAINER_NAME
azure:
  document_intelligence:
    endpoint: "${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}"
    key: "${AZURE_DOCUMENT_INTELLIGENCE_KEY}"
  openai:
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    key: "${AZURE_OPENAI_KEY}"
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  speech:
    key: "${AZURE_SPEECH_KEY}"
    region: "${AZURE_SPEECH_REGION}"
  storage:
    connection_string: "${AZURE_STORAGE_CONNECTION_STRING}"
    container_name: "${AZURE_STORAGE_CONTAINER_NAME}"
